name: Neubird - Upgrade from Upstream Langfuse

on:
  # Manual trigger with git tag input
  workflow_dispatch:
    inputs:
      git_tag:
        description: "Upstream git tag to merge (e.g., v3.224.2)"
        required: true
        type: string
      auto_merge:
        description: "Auto-approve and merge PR (requires no conflicts)"
        required: false
        type: boolean
        default: false

  # Allow triggering from another repository
  repository_dispatch:
    types: [upgrade-langfuse]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Log workflow trigger
        run: |
          echo "::notice::Starting Langfuse upgrade workflow"
          echo "Git tag: ${{ github.event.inputs.git_tag || github.event.client_payload.git_tag }}"
          echo "Triggered by: ${{ github.event_name }}"

      - name: Set git tag variable
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${{ github.event.client_payload.git_tag }}"
            AUTO_MERGE="${{ github.event.client_payload.auto_merge }}"
          else
            TAG="${{ github.event.inputs.git_tag }}"
            AUTO_MERGE="${{ github.event.inputs.auto_merge }}"
          fi
          echo "git_tag=$TAG" >> $GITHUB_OUTPUT
          echo "auto_merge=${AUTO_MERGE:-false}" >> $GITHUB_OUTPUT
          echo "::notice::Using git tag: $TAG"
          echo "::notice::Auto-merge enabled: ${AUTO_MERGE:-false}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          echo "::group::Configuring Git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Git configured successfully"
          echo "::endgroup::"

      - name: Setup upstream remote
        id: setup-upstream
        run: |
          echo "::group::Setting up upstream remote"

          # Add upstream remote (ignore error if exists)
          if git remote add upstream https://github.com/langfuse/langfuse.git 2>/dev/null; then
            echo "::notice::Upstream remote added"
          else
            echo "::notice::Upstream remote already exists"
          fi

          # Fetch upstream with tags
          echo "Fetching upstream repository..."
          if git fetch upstream --tags; then
            echo "::notice::Successfully fetched upstream"
          else
            echo "::error::Failed to fetch upstream repository"
            exit 1
          fi

          echo "::endgroup::"

      - name: Validate git tag exists
        id: validate-tag
        run: |
          echo "::group::Validating git tag"
          TAG="${{ steps.set-tag.outputs.git_tag }}"

          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG exists in upstream"
          else
            echo "::error::Tag $TAG does not exist in upstream repository"
            echo "Available recent tags:"
            git tag -l --sort=-version:refname | head -10
            exit 1
          fi

          echo "::endgroup::"

      - name: Get current version
        id: current-version
        run: |
          # Try to get current version from package.json or git tag
          CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "unknown")
          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          echo "::notice::Current version: $CURRENT_TAG"

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%s')" >> $GITHUB_OUTPUT

      - name: Create upgrade branch
        id: create-branch
        run: |
          echo "::group::Creating upgrade branch"
          TAG="${{ steps.set-tag.outputs.git_tag }}"
          DATE="${{ steps.date.outputs.date }}"
          BRANCH_NAME="weekly-upgrade-langfuse-$TAG-$DATE"

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          # Check if branch already exists
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "::warning::Branch $BRANCH_NAME already exists"
            echo "branch_exists=true" >> $GITHUB_OUTPUT
          else
            git checkout -b "$BRANCH_NAME"
            echo "::notice::Created branch: $BRANCH_NAME"
            echo "branch_exists=false" >> $GITHUB_OUTPUT
          fi

          echo "::endgroup::"

      - name: Handle existing branch
        if: steps.create-branch.outputs.branch_exists == 'true'
        run: |
          echo "::warning::Branch ${{ steps.create-branch.outputs.branch_name }} already exists"
          echo ""
          echo "This could mean:"
          echo "  1. A previous upgrade workflow run created this branch"
          echo "  2. There might be an open PR for this upgrade already"
          echo ""
          echo "Please check:"
          echo "  - Open PRs: https://github.com/${{ github.repository }}/pulls"
          echo "  - Or delete the branch to retry: git push origin --delete ${{ steps.create-branch.outputs.branch_name }}"
          exit 1

      - name: Merge upstream tag
        id: merge-tag
        if: steps.create-branch.outputs.branch_exists == 'false'
        run: |
          echo "::group::Merging upstream tag"
          TAG="${{ steps.set-tag.outputs.git_tag }}"
          BRANCH_NAME="${{ steps.create-branch.outputs.branch_name }}"

          echo "Attempting to merge tag $TAG..."

          # Attempt merge with custom commit message
          if git merge "$TAG" -m "Merge tag '$TAG' into $BRANCH_NAME"; then
            echo "::notice::Merge completed successfully"
            echo "merge_status=success" >> $GITHUB_OUTPUT
          else
            MERGE_EXIT_CODE=$?
            echo "::warning::Merge completed with exit code: $MERGE_EXIT_CODE"
            echo "merge_status=conflict" >> $GITHUB_OUTPUT
          fi

          echo "::endgroup::"

      - name: Push upgrade branch
        if: steps.create-branch.outputs.branch_exists == 'false'
        run: |
          echo "::group::Pushing upgrade branch"
          BRANCH_NAME="${{ steps.create-branch.outputs.branch_name }}"

          # Push branch even if there are conflicts
          # This allows users to checkout the branch and resolve conflicts locally
          git push origin "$BRANCH_NAME"
          echo "::notice::Successfully pushed branch $BRANCH_NAME"

          echo "::endgroup::"

      - name: Check for conflicts
        id: check-conflicts
        if: steps.create-branch.outputs.branch_exists == 'false'
        run: |
          echo "::group::Checking for merge conflicts"

          # Check if there are any unmerged paths
          if git ls-files -u | grep -q .; then
            echo "::warning::Merge conflicts detected!"
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            
            # List all conflicted files
            echo "Conflicted files:"
            git diff --name-only --diff-filter=U | tee /tmp/conflicted_files.txt
            
            # Store conflict details
            CONFLICTED_FILES=$(git diff --name-only --diff-filter=U | tr '\n' ',' | sed 's/,$//')
            echo "conflicted_files=$CONFLICTED_FILES" >> $GITHUB_OUTPUT
            
            # Get conflict count
            CONFLICT_COUNT=$(git diff --name-only --diff-filter=U | wc -l)
            echo "conflict_count=$CONFLICT_COUNT" >> $GITHUB_OUTPUT
            
            echo "::warning::Found $CONFLICT_COUNT conflicted file(s)"
            echo "::notice::Branch has been pushed for manual conflict resolution"
          else
            echo "::notice::No merge conflicts detected"
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
          fi

          echo "::endgroup::"

      - name: Check for changes
        if: steps.check-conflicts.outputs.has_conflicts == 'false' && steps.create-branch.outputs.branch_exists == 'false'
        id: check-changes
        run: |
          echo "::group::Checking for changes"
          BRANCH_NAME="${{ steps.create-branch.outputs.branch_name }}"

          # Check if there are any differences between the branch and main
          if git diff --quiet origin/main.."$BRANCH_NAME"; then
            echo "::warning::No changes detected between $BRANCH_NAME and main"
            echo "::notice::Repository is already up-to-date with the target tag"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "::notice::Changes detected, proceeding with PR creation"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

          echo "::endgroup::"

      - name: Clean up branch with no changes
        if: steps.check-changes.outputs.has_changes == 'false'
        run: |
          echo "::group::Cleaning up branch"
          BRANCH_NAME="${{ steps.create-branch.outputs.branch_name }}"

          echo "Deleting branch $BRANCH_NAME (no changes to merge)"
          git push origin --delete "$BRANCH_NAME" || echo "Branch deletion skipped or failed"

          echo "::endgroup::"

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Creating Pull Request"
          TAG="${{ steps.set-tag.outputs.git_tag }}"
          CURRENT_TAG="${{ steps.current-version.outputs.current_tag }}"
          BRANCH_NAME="${{ steps.create-branch.outputs.branch_name }}"

          # Create PR body
          PR_BODY=$(cat <<EOF
          ## Upgrade Langfuse to $TAG

          ### Changes
          - Merge upstream tag $TAG from langfuse/langfuse
          - App version: $CURRENT_TAG → $TAG

          ---
          *Automated upgrade created by workflow on $(date -u '+%Y-%m-%d %H:%M:%S UTC')*

          <!-- Automation Config -->
          auto-merge: ${{ steps.set-tag.outputs.auto_merge }}
          EOF
          )

          # Create the PR
          PR_URL=$(gh pr create \
            --title "Upgrade Langfuse to $TAG" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH_NAME")

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "::notice::Pull request created: $PR_URL"

          # Extract PR number from URL
          PR_NUMBER=$(echo "$PR_URL" | awk -F'/' '{print $NF}')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "::notice::Pull request number: $PR_NUMBER"

          echo "::endgroup::"

      - name: Workflow summary
        if: always()
        run: |
          echo "### Langfuse Upgrade Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Git Tag**: ${{ steps.set-tag.outputs.git_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ steps.create-branch.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Current Version**: ${{ steps.current-version.outputs.current_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Auto-merge**: ${{ steps.set-tag.outputs.auto_merge }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check-conflicts.outputs.has_conflicts }}" = "true" ]; then
            echo "**Status**: ⚠️ Merge conflicts detected" >> $GITHUB_STEP_SUMMARY
            echo "**Branch**: \`${{ steps.create-branch.outputs.branch_name }}\` (pushed to remote)" >> $GITHUB_STEP_SUMMARY
            echo "**Conflicted Files**: ${{ steps.check-conflicts.outputs.conflict_count }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Conflicted Files" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.check-conflicts.outputs.conflicted_files }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Resolution Steps" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Good news**: The branch has been pushed to remote for you!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. **Checkout the branch:**" >> $GITHUB_STEP_SUMMARY
            echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "   git fetch origin" >> $GITHUB_STEP_SUMMARY
            echo "   git checkout ${{ steps.create-branch.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
            echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "2. **Review and resolve conflicts** in each file listed above" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "3. **Stage resolved files:**" >> $GITHUB_STEP_SUMMARY
            echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "   git add <resolved-files>" >> $GITHUB_STEP_SUMMARY
            echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "4. **Complete the merge:**" >> $GITHUB_STEP_SUMMARY
            echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "   git commit -m \"Resolve conflicts for ${{ steps.set-tag.outputs.git_tag }} upgrade\"" >> $GITHUB_STEP_SUMMARY
            echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "5. **Push your changes:**" >> $GITHUB_STEP_SUMMARY
            echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "   git push origin ${{ steps.create-branch.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
            echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "6. **Create the PR:**" >> $GITHUB_STEP_SUMMARY
            echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "   gh pr create --title \"Upgrade Langfuse to ${{ steps.set-tag.outputs.git_tag }}\" --base main --head ${{ steps.create-branch.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
            echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "💡 **Pro Tip**: Add \`[auto-merge]\` to the PR body to enable automatic approval, merge, and build trigger!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🤖 **Automation Ready**: Once you create the PR, the PR Automation workflow will activate and can handle the rest automatically if you enable auto-merge." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.create-branch.outputs.branch_exists }}" = "true" ]; then
            echo "**Status**: ⚠️ Branch already exists" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.check-changes.outputs.has_changes }}" = "false" ]; then
            echo "**Status**: ℹ️ No Changes - Already Up-to-Date" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Repository is already up-to-date with tag \`${{ steps.set-tag.outputs.git_tag }}\`." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No pull request needed - no differences detected between main and the upstream tag." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.create-pr.outputs.pr_url }}" != "" ]; then
            echo "**Status**: ✅ Success - PR Created" >> $GITHUB_STEP_SUMMARY
            echo "**PR**: ${{ steps.create-pr.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.set-tag.outputs.auto_merge }}" = "true" ]; then
              echo "🤖 **PR Automation**: Auto-merge is enabled" >> $GITHUB_STEP_SUMMARY
              echo "The PR Automation workflow will handle approval, merge, and build trigger automatically." >> $GITHUB_STEP_SUMMARY
            else
              echo "👀 **Manual Review Required**" >> $GITHUB_STEP_SUMMARY
              echo "Review and merge the PR manually. After merge, the build workflow can be triggered:" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
              echo "gh workflow run build-push-neubirdai.yml -f git_tag=\"${{ steps.set-tag.outputs.git_tag }}\"" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "**Status**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi

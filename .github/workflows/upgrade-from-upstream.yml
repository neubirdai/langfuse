name: Upgrade from Upstream Langfuse

on:
  # Manual trigger with git tag input
  workflow_dispatch:
    inputs:
      git_tag:
        description: "Upstream git tag to merge (e.g., v2.75.2)"
        required: true
        type: string
      auto_merge:
        description: "Auto-approve and merge PR (requires no conflicts)"
        required: false
        type: boolean
        default: false

  # Allow triggering from another repository
  repository_dispatch:
    types: [upgrade-langfuse]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Log workflow trigger
        run: |
          echo "::notice::Starting Langfuse upgrade workflow"
          echo "Git tag: ${{ github.event.inputs.git_tag || github.event.client_payload.git_tag }}"
          echo "Triggered by: ${{ github.event_name }}"

      - name: Set git tag variable
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${{ github.event.client_payload.git_tag }}"
            AUTO_MERGE="${{ github.event.client_payload.auto_merge }}"
          else
            TAG="${{ github.event.inputs.git_tag }}"
            AUTO_MERGE="${{ github.event.inputs.auto_merge }}"
          fi
          echo "git_tag=$TAG" >> $GITHUB_OUTPUT
          echo "auto_merge=${AUTO_MERGE:-false}" >> $GITHUB_OUTPUT
          echo "::notice::Using git tag: $TAG"
          echo "::notice::Auto-merge enabled: ${AUTO_MERGE:-false}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          echo "::group::Configuring Git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Git configured successfully"
          echo "::endgroup::"

      - name: Setup upstream remote
        id: setup-upstream
        run: |
          echo "::group::Setting up upstream remote"

          # Add upstream remote (ignore error if exists)
          if git remote add upstream https://github.com/langfuse/langfuse.git 2>/dev/null; then
            echo "::notice::Upstream remote added"
          else
            echo "::notice::Upstream remote already exists"
          fi

          # Fetch upstream with tags
          echo "Fetching upstream repository..."
          if git fetch upstream --tags; then
            echo "::notice::Successfully fetched upstream"
          else
            echo "::error::Failed to fetch upstream repository"
            exit 1
          fi

          echo "::endgroup::"

      - name: Validate git tag exists
        id: validate-tag
        run: |
          echo "::group::Validating git tag"
          TAG="${{ steps.set-tag.outputs.git_tag }}"

          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG exists in upstream"
          else
            echo "::error::Tag $TAG does not exist in upstream repository"
            echo "Available recent tags:"
            git tag -l --sort=-version:refname | head -10
            exit 1
          fi

          echo "::endgroup::"

      - name: Get current version
        id: current-version
        run: |
          # Try to get current version from package.json or git tag
          CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "unknown")
          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          echo "::notice::Current version: $CURRENT_TAG"

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%s')" >> $GITHUB_OUTPUT

      - name: Create upgrade branch
        id: create-branch
        run: |
          echo "::group::Creating upgrade branch"
          TAG="${{ steps.set-tag.outputs.git_tag }}"
          DATE="${{ steps.date.outputs.date }}"
          BRANCH_NAME="weekly-upgrade-langfuse-$TAG-$DATE"

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          # Check if branch already exists
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "::warning::Branch $BRANCH_NAME already exists"
            echo "branch_exists=true" >> $GITHUB_OUTPUT
          else
            git checkout -b "$BRANCH_NAME"
            echo "::notice::Created branch: $BRANCH_NAME"
            echo "branch_exists=false" >> $GITHUB_OUTPUT
          fi

          echo "::endgroup::"

      - name: Handle existing branch
        if: steps.create-branch.outputs.branch_exists == 'true'
        run: |
          echo "::warning::Branch ${{ steps.create-branch.outputs.branch_name }} already exists"
          echo ""
          echo "This could mean:"
          echo "  1. A previous upgrade workflow run created this branch"
          echo "  2. There might be an open PR for this upgrade already"
          echo ""
          echo "Please check:"
          echo "  - Open PRs: https://github.com/${{ github.repository }}/pulls"
          echo "  - Or delete the branch to retry: git push origin --delete ${{ steps.create-branch.outputs.branch_name }}"
          exit 1

      - name: Merge upstream tag
        id: merge-tag
        if: steps.create-branch.outputs.branch_exists == 'false'
        run: |
          echo "::group::Merging upstream tag"
          TAG="${{ steps.set-tag.outputs.git_tag }}"
          BRANCH_NAME="${{ steps.create-branch.outputs.branch_name }}"

          echo "Attempting to merge tag $TAG..."

          # Attempt merge with custom commit message
          if git merge "$TAG" -m "Merge tag '$TAG' into $BRANCH_NAME"; then
            echo "::notice::Merge completed successfully"
            echo "merge_status=success" >> $GITHUB_OUTPUT
          else
            MERGE_EXIT_CODE=$?
            echo "::warning::Merge completed with exit code: $MERGE_EXIT_CODE"
            echo "merge_status=conflict" >> $GITHUB_OUTPUT
          fi

          echo "::endgroup::"

      - name: Check for conflicts
        id: check-conflicts
        if: steps.create-branch.outputs.branch_exists == 'false'
        run: |
          echo "::group::Checking for merge conflicts"

          # Check if there are any unmerged paths
          if git ls-files -u | grep -q .; then
            echo "::error::Merge conflicts detected!"
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            
            # List all conflicted files
            echo "Conflicted files:"
            git diff --name-only --diff-filter=U | tee /tmp/conflicted_files.txt
            
            # Store conflict details
            CONFLICTED_FILES=$(git diff --name-only --diff-filter=U | tr '\n' ',' | sed 's/,$//')
            echo "conflicted_files=$CONFLICTED_FILES" >> $GITHUB_OUTPUT
            
            # Get conflict count
            CONFLICT_COUNT=$(git diff --name-only --diff-filter=U | wc -l)
            echo "conflict_count=$CONFLICT_COUNT" >> $GITHUB_OUTPUT
            
            echo "::error::Found $CONFLICT_COUNT conflicted file(s)"
          else
            echo "::notice::No merge conflicts detected"
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
          fi

          echo "::endgroup::"

      - name: Create conflict issue
        if: steps.check-conflicts.outputs.has_conflicts == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.set-tag.outputs.git_tag }}';
            const branch = '${{ steps.create-branch.outputs.branch_name }}';
            const conflictCount = '${{ steps.check-conflicts.outputs.conflict_count }}';
            const conflictedFiles = '${{ steps.check-conflicts.outputs.conflicted_files }}'.split(',');

            const issueBody = `## 🚨 Merge Conflicts Detected During Upgrade

            ### Details
            - **Target Tag**: \`${tag}\`
            - **Branch**: \`${branch}\`
            - **Conflicted Files**: ${conflictCount}
            - **Workflow Run**: [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### Conflicted Files
            ${conflictedFiles.map(file => `- \`${file}\``).join('\n')}

            ### Resolution Steps
            1. Checkout the branch locally:
               \`\`\`bash
               git fetch origin
               git checkout ${branch}
               \`\`\`

            2. Review and resolve conflicts in each file

            3. Stage resolved files:
               \`\`\`bash
               git add <resolved-files>
               \`\`\`

            4. Complete the merge:
               \`\`\`bash
               git commit -m "Resolve conflicts for ${tag} upgrade"
               \`\`\`

            5. Push the changes:
               \`\`\`bash
               git push origin ${branch}
               \`\`\`

            6. Create a pull request manually or re-run this workflow

            ### Next Steps
            Once conflicts are resolved and pushed, the PR can be created manually using:
            \`\`\`bash
            gh pr create --title "Upgrade Langfuse to ${tag}" --base main --head ${branch}
            \`\`\`
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Merge conflicts in Langfuse upgrade to ${tag}`,
              body: issueBody,
              labels: ['merge-conflict', 'upgrade']
            });

            core.setFailed(`Merge conflicts detected in ${conflictCount} file(s). Issue created for manual resolution.`);

      - name: Push upgrade branch
        if: steps.check-conflicts.outputs.has_conflicts == 'false' && steps.create-branch.outputs.branch_exists == 'false'
        run: |
          echo "::group::Pushing upgrade branch"
          BRANCH_NAME="${{ steps.create-branch.outputs.branch_name }}"

          git push origin "$BRANCH_NAME"
          echo "::notice::Successfully pushed branch $BRANCH_NAME"

          echo "::endgroup::"

      - name: Create Pull Request
        if: steps.check-conflicts.outputs.has_conflicts == 'false' && steps.create-branch.outputs.branch_exists == 'false'
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Creating Pull Request"
          TAG="${{ steps.set-tag.outputs.git_tag }}"
          CURRENT_TAG="${{ steps.current-version.outputs.current_tag }}"
          BRANCH_NAME="${{ steps.create-branch.outputs.branch_name }}"

          # Create PR body
          PR_BODY=$(cat <<EOF
          ## Upgrade Langfuse to $TAG

          ### Changes
          - Merge upstream tag $TAG from langfuse/langfuse
          - App version: $CURRENT_TAG → $TAG
          - Helm chart compatibility: 1.5.41

          ### Deployment Plan
          After merge:
          1. Manually trigger build workflow: \`gh workflow run build-push-neubirdai.yml -f git_tag="$TAG"\`
          2. Build workflow will push new images with tags: \`$TAG\` and \`latest\`
          3. Update raven-infra Helm chart to 1.5.41
          4. Deploy to dev environment first
          5. Validate with functional tests
          6. Promote to production

          ---
          *Automated upgrade created by workflow on $(date -u '+%Y-%m-%d %H:%M:%S UTC')*
          EOF
          )

          # Create the PR
          PR_URL=$(gh pr create \
            --title "Upgrade Langfuse to $TAG" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH_NAME" \
            --label "upgrade,dependencies")

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "::notice::Pull request created: $PR_URL"

          # Extract PR number from URL
          PR_NUMBER=$(echo "$PR_URL" | awk -F'/' '{print $NF}')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "::notice::Pull request number: $PR_NUMBER"

          echo "::endgroup::"

      - name: Auto-approve Pull Request
        if: steps.create-pr.outputs.pr_number != '' && steps.set-tag.outputs.auto_merge == 'true'
        uses: hmarr/auto-approve-action@v4
        with:
          pull-request-number: ${{ steps.create-pr.outputs.pr_number }}
          github-token: ${{ secrets.RAVEN_API_CLONE_PAT }}

      - name: Auto-merge Pull Request
        if: steps.create-pr.outputs.pr_number != '' && steps.set-tag.outputs.auto_merge == 'true'
        id: auto-merge
        run: |
          echo "::group::Auto-merging Pull Request"
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"

          # Retry merge to handle race conditions
          RETRIES=3
          for attempt in $(seq 1 $RETRIES); do
            echo "Merge attempt $attempt of $RETRIES..."
            if gh pr merge "$PR_NUMBER" --squash --admin; then
              echo "merge_status=success" >> $GITHUB_OUTPUT
              echo "::notice::PR merged successfully"
              echo "::endgroup::"
              exit 0
            else
              if [ $attempt -lt $RETRIES ]; then
                echo "::warning::Merge failed, retrying in 2 seconds..."
                sleep 2
              else
                echo "merge_status=failed" >> $GITHUB_OUTPUT
                echo "::error::Failed to merge after $RETRIES attempts"
                echo "::endgroup::"
                exit 1
              fi
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.RAVEN_API_CLONE_PAT }}

      - name: Trigger build workflow after merge
        if: steps.auto-merge.outputs.merge_status == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Triggering build workflow"
          TAG="${{ steps.set-tag.outputs.git_tag }}"

          echo "PR was auto-merged. Triggering build workflow with tag: $TAG"

          gh workflow run build-push-neubirdai.yml \
            --ref main \
            -f git_tag="$TAG"

          echo "::notice::Build workflow triggered successfully"
          echo "::endgroup::"

      - name: Add PR comment with build instructions
        if: steps.create-pr.outputs.pr_url != '' && steps.set-tag.outputs.auto_merge == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Adding build instructions to PR"
          BRANCH_NAME="${{ steps.create-branch.outputs.branch_name }}"
          TAG="${{ steps.set-tag.outputs.git_tag }}"

          gh pr comment "${{ steps.create-pr.outputs.pr_url }}" --body "## 🚀 Next Steps

          ### After PR Review and Merge:
          Trigger the build workflow to create Docker images:
          \`\`\`bash
          gh workflow run build-push-neubirdai.yml -f git_tag=\"$TAG\"
          \`\`\`

          Or set up automatic build on PR merge by adding this to your workflow triggers."

          echo "::notice::Build instructions added to PR"
          echo "::endgroup::"

      - name: Workflow summary
        if: always()
        run: |
          echo "### Langfuse Upgrade Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Git Tag**: ${{ steps.set-tag.outputs.git_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ steps.create-branch.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Current Version**: ${{ steps.current-version.outputs.current_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Auto-merge**: ${{ steps.set-tag.outputs.auto_merge }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check-conflicts.outputs.has_conflicts }}" = "true" ]; then
            echo "**Status**: ❌ Merge conflicts detected" >> $GITHUB_STEP_SUMMARY
            echo "**Conflicted Files**: ${{ steps.check-conflicts.outputs.conflict_count }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "A GitHub issue has been created for manual resolution." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.create-branch.outputs.branch_exists }}" = "true" ]; then
            echo "**Status**: ⚠️ Branch already exists" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.auto-merge.outputs.merge_status }}" = "success" ]; then
            echo "**Status**: ✅ Success - PR Auto-merged" >> $GITHUB_STEP_SUMMARY
            echo "**PR**: ${{ steps.create-pr.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ PR was automatically approved and merged." >> $GITHUB_STEP_SUMMARY
            echo "🚀 Build workflow has been triggered automatically." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.create-pr.outputs.pr_url }}" != "" ]; then
            echo "**Status**: ✅ Success - Manual Review Required" >> $GITHUB_STEP_SUMMARY
            echo "**PR**: ${{ steps.create-pr.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Important**: After merging the PR, manually trigger the build workflow:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "gh workflow run build-push-neubirdai.yml -f git_tag=\"${{ steps.set-tag.outputs.git_tag }}\"" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create failure issue
        if: failure() && steps.check-conflicts.outputs.has_conflicts != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.set-tag.outputs.git_tag }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';

            const issueBody = `## ⚠️ Upgrade Workflow Failed

            ### Details
            - **Target Tag**: \`${tag}\`
            - **Workflow Run**: [View Run](${runUrl})
            - **Failed Step**: Check the workflow logs for details

            ### Investigation Required
            The automated upgrade workflow failed for reasons other than merge conflicts.
            Please review the workflow logs to identify the issue.

            ### Common Issues
            - Upstream repository fetch failure
            - Invalid git tag provided
            - Branch creation or push permission issues
            - GitHub API rate limits

            ### Next Steps
            1. Review the [workflow logs](${runUrl})
            2. Identify the root cause
            3. Fix the issue or perform manual upgrade
            4. Re-run the workflow if appropriate
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upgrade workflow failed for ${tag}`,
              body: issueBody,
              labels: ['workflow-failure', 'upgrade']
            });
